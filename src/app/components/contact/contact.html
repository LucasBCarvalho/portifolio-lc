<section id="contato" class="section">
  <div class="container">
    <header class="section-head" appReveal>
      <span class="eyebrow">// contato</span>
      <h2>Vamos <span class="gradient-text">conversar?</span></h2>
      <p>
        Estou aberto a oportunidades como desenvolvedor fullstack Angular/PHP, freelas e projetos
        com IA.
      </p>
    </header>

    <div class="grid">
      <div class="channels" appReveal>
        <button type="button" class="card channel" (click)="copyEmail()">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 6h18v12H3zM3 7l9 6 9-6"
              />
            </svg>
          </span>
          <span class="info">
            <small>E-mail {{ copied() ? '· copiado!' : '· clique para copiar' }}</small>
            <strong>{{ profile.email }}</strong>
          </span>
        </button>

        <a class="card channel" [href]="profile.linkedin" target="_blank" rel="noopener">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                fill="currentColor"
                d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45Z"
              />
            </svg>
          </span>
          <span class="info">
            <small>LinkedIn</small>
            <strong>Lucas Carvalho</strong>
          </span>
        </a>

        <a class="card channel" [href]="profile.github" target="_blank" rel="noopener">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                fill="currentColor"
                d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"
              />
            </svg>
          </span>
          <span class="info">
            <small>GitHub</small>
            <strong>&#64;{{ profile.githubUser }}</strong>
          </span>
        </a>

        <a class="card channel" [href]="whatsapp" target="_blank" rel="noopener">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
                d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.2 3.2Z"
              />
            </svg>
          </span>
          <span class="info">
            <small>WhatsApp</small>
            <strong>{{ profile.phone }}</strong>
          </span>
        </a>
      </div>

      <form
        class="card form"
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
        appReveal
        [revealDelay]="100"
      >
        <label>
          <span>Nome</span>
          <input type="text" formControlName="name" autocomplete="name" placeholder="Seu nome" />
          @if (invalid('name')) {
            <small class="error">Informe seu nome.</small>
          }
        </label>

        <label>
          <span>E-mail</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="voce@empresa.com"
          />
          @if (invalid('email')) {
            <small class="error">Informe um e-mail válido.</small>
          }
        </label>

        <label>
          <span>Mensagem</span>
          <textarea
            formControlName="message"
            rows="5"
            placeholder="Conte um pouco sobre a oportunidade ou projeto..."
          ></textarea>
          @if (invalid('message')) {
            <small class="error">A mensagem precisa ter pelo menos 10 caracteres.</small>
          }
        </label>

        <button type="submit" class="btn btn-primary">
          Enviar mensagem
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 12h14m-6-6 6 6-6 6"
            />
          </svg>
        </button>
      </form>
    </div>
  </div>
</section>
