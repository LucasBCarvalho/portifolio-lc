<header class="nav" [class.scrolled]="scrolled()" [class.open]="menuOpen()">
  <div class="container nav-inner">
    @let ui = i18n.ui().nav;
    <a href="#inicio" class="logo" (click)="closeMenu()" [attr.aria-label]="ui.home">
      <span class="bracket">&lt;</span>LC<span class="bracket"> /&gt;</span>
    </a>

    <nav id="menu" class="links" [attr.aria-label]="ui.main">
      @for (id of sections; track id) {
        <a [href]="'#' + id" [class.active]="active() === id" (click)="closeMenu()">{{
          ui.links[id]
        }}</a>
      }
    </nav>

    <div class="actions">
      <button
        type="button"
        class="icon-btn lang-btn"
        (click)="i18n.toggle()"
        [attr.aria-label]="ui.switchLang"
        [title]="ui.switchLang"
      >
        {{ i18n.lang() === 'pt' ? 'EN' : 'PT' }}
      </button>

      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? ui.themeLight : ui.themeDark"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" />
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </g>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3a8.5 8.5 0 1 0 11.5 11.5Z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="icon-btn burger"
        (click)="toggleMenu()"
        aria-controls="menu"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="ui.menu"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
