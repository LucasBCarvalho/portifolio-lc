<header class="nav" [class.scrolled]="scrolled()" [class.open]="menuOpen()">
  <div class="container nav-inner">
    <a href="#inicio" class="logo" (click)="closeMenu()" aria-label="Voltar ao início">
      <span class="bracket">&lt;</span>LC<span class="bracket"> /&gt;</span>
    </a>

    <nav id="menu" class="links" aria-label="Navegação principal">
      @for (link of links; track link.id) {
        <a [href]="'#' + link.id" [class.active]="active() === link.id" (click)="closeMenu()">{{
          link.label
        }}</a>
      }
    </nav>

    <div class="actions">
      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" />
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </g>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3a8.5 8.5 0 1 0 11.5 11.5Z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="icon-btn burger"
        (click)="toggleMenu()"
        aria-controls="menu"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir menu"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
